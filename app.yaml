# Laufzeitkonfiguration der Databricks App. Wird von der Apps-Runtime direkt gelesen;
# Ressourcen und Berechtigungen stehen in databricks.yml (Target „app") — die App ist
# Opt-in und NICHT Teil des Standard-Deployments.
#
# Der Umweg über run-app.mjs ist nötig: die Plattform führt den Befehl OHNE Shell aus,
# deshalb kann der Port nicht per ${DATABRICKS_APP_PORT} in die Argumentliste. run-app.mjs
# liest die Variable selbst und bindet an 0.0.0.0 (localhost => 502).

command:
  - node
  - run-app.mjs

env:
  # Sagt der App, dass sie als Databricks App läuft (DB über Lakebase).
  - name: WIND_RUNTIME
    value: "databricks-app"
  - name: WIND_DB
    value: "lakebase"
  - name: NODE_ENV
    value: "production"

  # Diese App RUFT KEINE DATEN AB und LERNT NICHT. Beides sind eigene Databricks-Jobs
  # (scripts/ingest_job.py alle 30 min, scripts/skill_job.py stündlich) — sonst hängt eine
  # 24/7-Datenbasis am Lebenszyklus einer Oberfläche, die nachts aus ist oder gelöscht wurde.
  # Es gibt deshalb auch keinen POLL_ENABLED-Schalter mehr: es gibt nur noch einen Schreibpfad.

  # Schema, das der App-Service-Principal in Lakebase besitzt (siehe DATABRICKS.md).
  # Muss zum lakebase_schema in databricks.yml passen.
  - name: LAKEBASE_SCHEMA
    value: "windguru"

  # Lakebase spritzt die Plattform aus der `postgres`-Ressource selbst ein: PGHOST,
  # PGDATABASE, PGUSER und LAKEBASE_ENDPOINT. DATABRICKS_HOST + SP-Zugangsdaten
  # (DATABRICKS_CLIENT_ID/SECRET) stellt die Apps-Runtime bereit. Deshalb hier NICHT.
