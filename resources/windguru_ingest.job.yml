# Datenerfassung: zieht 24/7 alle 30 Minuten die Windguru-Prognose, die Messstationen (bei
# Windguru-Stationen den Verlauf der letzten Stunden, Lücken füllen sich so selbst) und die
# Wassertemperatur von Rijkswaterstaat und schreibt sie nach Lakebase (scripts/ingest_job.py).
#
# Serverless-Notebook-Task (keine job_clusters; Serverless muss im Workspace aktiv sein).
# Treiber pg8000 über die Environment — psycopg2 crasht auf Serverless.
#
# Berechtigung: Der Job läuft als die deployende Person; sie muss in Lakebase in das Schema
# schreiben dürfen (bei setup.mjs ist sie Eigentümerin der Tabellen).

resources:
  jobs:
    windguru_ingest:
      name: "${var.app_name} — Datenerfassung (alle 30 min, 24/7)"
      schedule:
        # Quartz-Cron: zur Minute 0 und 30 jeder Stunde, rund um die Uhr.
        quartz_cron_expression: "0 0,30 * * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      # Serverless-Environment mit vorinstalliertem Postgres-Treiber.
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - pg8000

      tasks:
        - task_key: ingest
          environment_key: default
          notebook_task:
            notebook_path: ../scripts/ingest_job.py
            base_parameters:
              LAKEBASE_SCHEMA: ${var.lakebase_schema}
              LAKEBASE_PROJECT: ${var.lakebase_project}
              LAKEBASE_BRANCH: ${var.lakebase_branch}
              # 0 = unbegrenzt aufbewahren (Saisonalität).
              SNAPSHOT_RETENTION_DAYS: "0"
              # Verdichtung (Lakebase Free Edition: 512 MB): älter als 21 Tage nur noch ein
              # Abruf je Spot und 6 h; Modell-Reihen ohne Verweis fallen mit weg.
              THIN_AFTER_DAYS: "21"
              THIN_KEEP_H: "6"
              # So viele Stunden Stationsverlauf holt jeder Lauf nach (Windguru-Stationen).
              STATION_BACKFILL_H: "6"
