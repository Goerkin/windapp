# Lifecycle-Jobs: halten die Windguru App im Fenster 6–23 Uhr (Europe/Berlin) verfügbar.
# Pausieren (z. B. wenn die App gelöscht ist und nur die Datenerfassung laufen soll):
#   databricks bundle deploy --var lifecycle_pause=PAUSED
# Databricks Apps laufen sonst dauerhaft — hier startet ein Job sie morgens und ein zweiter
# stoppt sie abends. Zwei getrennte Jobs, weil ein Job nur EINEN Zeitplan haben kann.
#
# Beide Tasks laufen auf Serverless-Compute (keine job_clusters nötig; muss im Workspace
# aktiviert sein). Der Job läuft standardmäßig als die deployende Person, die CAN_MANAGE
# auf der App hat (aus windguru_app.app.yml) — Voraussetzung für apps.start/stop.

resources:
  jobs:
    windguru_app_start:
      name: "${var.app_name} — App-Start (6 Uhr)"
      schedule:
        # Quartz-Cron: Sekunde Minute Stunde Tag Monat Wochentag. Täglich 06:00.
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: Europe/Berlin
        pause_status: ${var.lifecycle_pause}
      tasks:
        - task_key: start_app
          notebook_task:
            notebook_path: ../scripts/app_lifecycle.py
            base_parameters:
              action: start
              app_name: ${var.app_name}

    windguru_app_stop:
      name: "${var.app_name} — App-Stopp (23 Uhr)"
      schedule:
        # Täglich 23:00.
        quartz_cron_expression: "0 0 23 * * ?"
        timezone_id: Europe/Berlin
        pause_status: ${var.lifecycle_pause}
      tasks:
        - task_key: stop_app
          notebook_task:
            notebook_path: ../scripts/app_lifecycle.py
            base_parameters:
              action: stop
              app_name: ${var.app_name}
