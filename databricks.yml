# Wind Cockpit auf Databricks — Bundle-Definition: die DATENBASIS (Erfassungs-Job + Lern-Job).
#
# Bewusst workspace-neutral (keine URL/IDs/E-Mail hart drin). Der Zielworkspace kommt aus dem
# CLI-Profil (`-p <profil>`) oder DATABRICKS_HOST. Deploy-Anleitung: DATABRICKS.md.
#
# Die Oberfläche gehört NICHT hierher: sie ist eine reine Leseansicht und läuft auf Vercel
# (README). Erfassung UND Lernen laufen als Jobs (scripts/ingest_job.py, scripts/skill_job.py);
# die App kann jederzeit fehlen, ohne dass Daten oder Gelerntes stehen bleiben.

bundle:
  name: windguru

include:
  - resources/*.yml

variables:
  app_name:
    description: Namenspräfix der Jobs.
    default: windguru

  lakebase_project:
    description: >-
      Lakebase-Projekt (Postgres). Trägt Spots + Datenhistorie. Wird vor dem ersten Deploy
      angelegt (scripts/setup.mjs) — Lakebase-Projekte sind keine DAB-Ressource.
    default: windguru

  lakebase_branch:
    description: Branch innerhalb des Lakebase-Projekts.
    default: production

  lakebase_schema:
    description: Postgres-Schema, in dem alle Tabellen liegen (LAKEBASE_SCHEMA der Vercel-App).
    default: windguru

targets:
  dev:
    default: true

  prod:
    mode: production
